name: Check site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tests/update_prices_test.py
      - run: python tests/mod_identity_test.py
      - run: python tests/mod_details_test.py
      - name: Verify committed bundles
        run: git diff --exit-code -- assets/js
