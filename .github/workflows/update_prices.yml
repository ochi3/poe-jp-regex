name: Update Prices

on:
  schedule:
    # 4時間ごとに実行
    - cron: '0 */4 * * *'
  workflow_dispatch: # 手動実行も可能にする

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run update script
        run: python tooling/data/update-prices.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build updated price data
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/poe1/beastlist.json data/poe1/scarablist.json data/poe1/tattoolist.json data/poe1/runegraftlist.json data/poe1/essencelist.json assets/js/data-poe1.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update item prices [skip ci]"
            git push
          fi
